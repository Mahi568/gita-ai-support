
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Ujjwal AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{padding:18px;background:#172438;text-align:center;font-size:23px;font-weight:bold}
header small{display:block;font-size:12px;color:#9fb2cc;margin-top:5px}
#chat{height:calc(100dvh - 145px);overflow-y:auto;padding:15px}
.msg{padding:12px 15px;margin:10px 0;border-radius:14px;max-width:88%;line-height:1.5;white-space:pre-wrap}
.user{background:#1768d5;margin-left:auto}
.ai{background:#26364c;margin-right:auto}
footer{position:fixed;bottom:0;width:100%;padding:12px;background:#172438;display:flex;gap:7px}
input{flex:1;min-width:0;padding:13px;border:0;border-radius:12px;font-size:16px;background:#fff;color:#111}
button{border:0;border-radius:12px;padding:12px;background:#2676ed;color:white;font-size:16px}
#status{text-align:center;color:#9fb2cc;font-size:12px;padding:5px}
</style>
</head>
<body>
<header>✨ Ujjwal AI
<small>Your Personal AI Assistant</small>
</header>
<div id="chat">
<div class="msg ai">नमस्ते! 🙏 मैं Ujjwal AI हूँ। बताइए, मैं आपकी क्या मदद कर सकता हूँ?</div>
</div>
<div id="status">AI Assistant Ready</div>
<footer>
<input id="question" placeholder="अपना सवाल लिखें..." />
<button onclick="listen()">🎤</button>
<button onclick="send()">➤</button>
</footer>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxf6eFD8m88iFOPuUAxr96-aMIJtAMt6BWFobiFL7nmBgMEe94Wg_wQ9tys8wmpxG-z/exec";

const chat=document.getElementById("chat");
const input=document.getElementById("question");
const statusText=document.getElementById("status");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}

async function send(){
 const q=input.value.trim();
 if(!q)return;
 input.value="";
 addMessage(q,"user");
 const loading=addMessage("जवाब तैयार हो रहा है...","ai");
 statusText.textContent="Connecting...";
 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"text/plain;charset=utf-8"},
   body:JSON.stringify({message:q})
  });
  const data=await response.json();
  loading.textContent=data.answer || "कोई जवाब नहीं मिला।";
  statusText.textContent="Ready";
 }catch(error){
  loading.textContent="माफ कीजिए, कनेक्शन में समस्या है। कृपया दोबारा कोशिश करें।";
  statusText.textContent="Connection Error";
 }
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")send();
});

function listen(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  alert("Voice input इस browser में उपलब्ध नहीं है। Chrome में खोलकर देखें।");
  return;
 }
 const recognition=new SpeechRecognition();
 recognition.lang="hi-IN";
 recognition.onresult=e=>{
  input.value=e.results[0][0].transcript;
  send();
 };
 recognition.onerror=()=>statusText.textContent="Voice error";
 recognition.start();
}
</script>
</body>
</html>
