
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Ujjwal AI</title>
<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#172438;padding:16px;
 display:flex;justify-content:space-between;
 align-items:center;
}
.logo{font-size:23px;font-weight:bold;color:#55aaff}
button{
 border:0;border-radius:12px;padding:12px;
 background:#2676ed;color:white;font-size:16px;
}
#chat{
 height:calc(100dvh - 155px);
 overflow-y:auto;padding:15px;
}
.msg{
 padding:13px 15px;margin:12px 0;
 border-radius:16px;max-width:90%;
 line-height:1.6;white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user{background:#1768d5;margin-left:auto}
.ai{background:#26364c;margin-right:auto}
.actions{display:flex;gap:8px;margin-top:7px}
.actions button{font-size:13px;padding:7px}
footer{
 position:fixed;bottom:0;width:100%;
 background:#172438;padding:10px;
 display:flex;gap:7px;
}
input{
 flex:1;min-width:0;padding:13px;
 border:0;border-radius:12px;font-size:16px;
}
#status{text-align:center;color:#9fb2cc;font-size:12px;padding:5px}
</style>
</head>

<body>
<header>
 <div class="logo">✨ Ujjwal AI</div>
 <button onclick="newChat()">＋ New Chat</button>
</header>

<div id="chat">
 <div class="msg ai">
 नमस्ते! 🙏 मैं Ujjwal AI हूँ।
 आपका Personal AI Assistant।
 बताइए, मैं आपकी क्या मदद कर सकता हूँ?
 </div>
</div>

<div id="status">AI Assistant Ready</div>

<footer>
 <input id="question" placeholder="अपना सवाल लिखें...">
 <button onclick="listen()">🎤</button>
 <button onclick="send()">➤</button>
</footer>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzZiUptf_Ah6arP8c1xje-EUdJHIRtlJCtKMwMfO5WKGHb9GgYRwabhl7pmU0IqhdI/exec";

const chat=document.getElementById("chat");
const input=document.getElementById("question");
const statusText=document.getElementById("status");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}

function addSpeakButton(container,text){
 const actions=document.createElement("div");
 actions.className="actions";
 const btn=document.createElement("button");
 btn.textContent="🔊 जवाब सुनें";
 btn.onclick=()=>speak(text);
 actions.appendChild(btn);
 container.appendChild(actions);
}

async function send(){
 const q=input.value.trim();
 if(!q)return;

 input.value="";
 addMessage(q,"user");
 const loading=addMessage("जवाब तैयार हो रहा है...","ai");
 statusText.textContent="Connecting...";

 try{
  const response=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"text/plain;charset=utf-8"},
   body:JSON.stringify({message:q})
  });

  if(!response.ok)throw new Error("Server Error");

  const data=await response.json();
  const answer=data.answer||"जवाब नहीं मिला।";
  loading.textContent=answer;
  addSpeakButton(loading,answer);
  statusText.textContent="Ready";
 }catch(error){
  loading.textContent="कनेक्शन में समस्या है। कृपया दोबारा कोशिश करें।";
  statusText.textContent="Connection Error";
 }
}

function speak(text){
 if(!("speechSynthesis" in window)){
  alert("Voice Output उपलब्ध नहीं है।");
  return;
 }
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="hi-IN";
 utterance.rate=1;
 speechSynthesis.speak(utterance);
}

function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  alert("Voice Input के लिए Chrome इस्तेमाल करें।");
  return;
 }
 const recognition=new SR();
 recognition.lang="hi-IN";
 recognition.onstart=()=>statusText.textContent="सुन रहा हूँ...";
 recognition.onresult=e=>{
  input.value=e.results[0][0].transcript;
  send();
 };
 recognition.onerror=()=>statusText.textContent="Voice Error";
 recognition.onend=()=>statusText.textContent="Ready";
 recognition.start();
}

function newChat(){
 chat.innerHTML="";
 addMessage("नमस्ते! 🙏 मैं Ujjwal AI हूँ। बताइए, क्या मदद चाहिए?","ai");
 if("speechSynthesis" in window)speechSynthesis.cancel();
 statusText.textContent="New Chat Ready";
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")send();
});
</script>
</body>
</html>
